<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6b1e2e" />
    <!--
      Title, description, Open Graph and Twitter tags are injected at build
      time from src/config/wedding.js (see vite.config.js).
    -->
    <!--wedding-meta-->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  </head>
  <body>
    <div id="root"></div>
    <script>
      // Opened by double-clicking the file? Browsers block the app there.
      if (location.protocol === "file:") {
        document.addEventListener("DOMContentLoaded", function () {
          document.body.innerHTML =
            '<div style="font-family:Georgia,serif;max-width:560px;margin:12vh auto;padding:24px;text-align:center;color:#3a0e1b">' +
            "<h1>Please open this invitation through a web link</h1>" +
            "<p>Browsers do not run this site from a file on disk. Run <b>npm run dev</b> (or <b>npm run build</b> then <b>npm run preview</b>) and open the address it shows, or deploy it (Vercel / Netlify) and open that link.</p></div>";
        });
      }
    </script>
    <noscript>
      <p style="padding: 2rem; text-align: center; font-family: serif">
        Please enable JavaScript to view this wedding invitation.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
